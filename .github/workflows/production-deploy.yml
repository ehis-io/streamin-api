name: Deploy for Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: [self-hosted, streaming]

    steps:
      - name: 🧭 Checkout latest code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🧹 Clean workspace
        run: |
          echo "Cleaning workspace..."
          git clean -fdx

      - name: 🧼 Remove old build artifacts
        run: |
          echo "Removing old dist folder..."
          rm -rf dist

      - name: ⚙️ Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      - name: 🛠️ Create .env file
        run: |
          echo "Creating .env file..."
          cat <<EOF > .env
 
          PORT=${{ secrets.PORT }}
        
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          API_URL=${{ secrets.API_URL }}
          WYZIE_API_KEY=${{ secrets.WYZIE_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}

          # Puppeteer memory limits (repo variables; empty = code defaults)
          PUPPETEER_MAX_PAGES=${{ vars.PUPPETEER_MAX_PAGES }}
          PUPPETEER_PREWARM_PAGES=${{ vars.PUPPETEER_PREWARM_PAGES }}
          PUPPETEER_PAGE_MAX_USES=${{ vars.PUPPETEER_PAGE_MAX_USES }}
          PUPPETEER_IDLE_PAGE_TTL_MS=${{ vars.PUPPETEER_IDLE_PAGE_TTL_MS }}
          PUPPETEER_MAX_MEMORY_MB=${{ vars.PUPPETEER_MAX_MEMORY_MB }}

          EOF

      - name: 🔍 Check .env file
        # Print only which keys are set — never the values. `cat .env` dumped every
        # secret into the build log, which only stayed private because GitHub masks
        # exact-match secret values.
        run: |
          echo "Keys written to .env (values redacted):"
          grep -oE '^\s*[A-Z_]+=' .env | tr -d ' =' | sort
          echo "Missing/empty values:"
          grep -E '^\s*[A-Z_]+=\s*$' .env | tr -d ' =' || echo "  (none)"

      - name: 📦 Install dependencies
        run: npm install --no-audit --no-fund

      # - name: Run tests
        # run: npm run test

      - name: 🏗️ Build app & Run Migrations
        run: |
          NODE_OPTIONS="--max_old_space_size=4096" npm run build
      #     npm run migration:run

      - name: 🚀 Reload PM2
        run: |
          pm2 reload ecosystem.config.js --env development
          pm2 save

      - name: 📊 Memory report
        run: |
          free -m
          pm2 describe app | grep -iE "status|node args|max memory|restarts|heap size" || true
